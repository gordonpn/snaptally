codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 85%
        threshold: 0%

ignore:
  - "tests/**"

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
