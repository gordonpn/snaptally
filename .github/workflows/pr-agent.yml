name: PR-Agent

on:
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: runner / authorize-pr-agent
    if: |
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
         (startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/describe') ||
          startsWith(github.event.comment.body, '/improve') ||
          startsWith(github.event.comment.body, '/ask'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - name: Verify command and pull request origin
        id: authorize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            core.setOutput('allowed', 'false');
            const event = context.payload;
            if (context.eventName === 'issue_comment') {
              if (!/^\/(review|describe|improve|ask)(?:\s|$)/.test(event.comment.body)) return;
              if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(event.comment.author_association)) return;
            }
            const number = event.pull_request?.number ?? event.issue?.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state === 'open' && !pr.draft && pr.head.repo?.full_name === repository) {
              core.setOutput('allowed', 'true');
            }

  pr_agent:
    name: runner / pr-agent
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: PR Agent Action
        uses: The-PR-Agent/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975 # v0.46.0
        env:
          CONFIG.MODEL: "deepseek/deepseek-chat"
          CONFIG.FALLBACK_MODELS: '["deepseek/deepseek-chat"]'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_BASE: "https://api.deepseek.com"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
