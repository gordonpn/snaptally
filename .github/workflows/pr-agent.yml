name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    name: runner / authorize-pr-agent
    if: |
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
         (startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/describe') ||
          startsWith(github.event.comment.body, '/improve') ||
          startsWith(github.event.comment.body, '/ask'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - name: Checkout authorization script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Verify command and pull request origin
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: authorize } = await import('${{ github.workspace }}/.github/scripts/authorize-pr-agent.js');
            await authorize({ core, context, github });

  pr_agent:
    name: runner / pr-agent
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audited review labeler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: b16856ceb39a864868d93f6397f22abe5d329486
          sparse-checkout: .github/scripts/label-review.ts
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Validate required reviewer configuration
        run: ': "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}" "${GITHUB_TOKEN:?GITHUB_TOKEN is required}" "${DEEPSEEK_API_BASE:?DEEPSEEK_API_BASE is required}"; case "$DEEPSEEK_API_BASE" in https://?*) ;; *) exit 1 ;; esac'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_BASE: ${{ vars.DEEPSEEK_API_BASE }}
      - name: PR Agent Action
        uses: The-PR-Agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          CONFIG.MODEL: "deepseek/deepseek-chat"
          PR_REVIEWER.PERSISTENT_COMMENT: "false"
          PUSH_OUTPUTS.ENABLE: "true"
          PUSH_OUTPUTS.CHANNELS: '["file"]'
          PUSH_OUTPUTS.TOOLS: '["review"]'
          PUSH_OUTPUTS.FILE_PATH: /github/workspace/pr-agent-review-output.jsonl
          CONFIG.FALLBACK_MODELS: '["deepseek/deepseek-chat"]'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE: ${{ vars.DEEPSEEK_API_BASE }}
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
          GITHUB_ACTION_CONFIG.PUSH_TRIGGER_IGNORE_MERGE_COMMITS: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Label the published review revision
        if: github.event_name == 'pull_request' || startsWith(github.event.comment.body, '/review')
        run: node .github/scripts/label-review.ts
        env:
          REVIEW_OUTPUT_PATH: pr-agent-review-output.jsonl
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
