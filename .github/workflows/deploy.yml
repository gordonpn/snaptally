name: deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: runner / deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'pages-preview-database' || 'pages-production' }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    outputs:
      cloudflare-configured: ${{ steps.check-credentials.outputs.configured }}
      alias-url: ${{ steps.wrangler.outputs.pages-deployment-alias-url }}
      deployment-url: ${{ steps.wrangler.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Cloudflare credentials
        id: check-credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./.github/scripts/check-cloudflare-credentials.sh

      - name: Setup pnpm
        if: steps.check-credentials.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.check-credentials.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check-credentials.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build static assets
        if: steps.check-credentials.outputs.configured == 'true'
        run: pnpm build

      - name: Apply D1 database migrations
        if: steps.check-credentials.outputs.configured == 'true' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply budget-db --remote

      - name: Validate migrations in a fresh local database
        if: steps.check-credentials.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: |
          migration_state=$(mktemp -d)
          trap 'rm -rf "$migration_state"' EXIT
          pnpm exec wrangler d1 migrations apply budget-db --local --persist-to "$migration_state"

      - name: Check shared preview schema compatibility
        id: preview-schema
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-preview-schema.sh "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Explain schema preview restriction
        if: github.event_name == 'pull_request' && steps.preview-schema.outputs.safe != 'true'
        run: echo 'Schema-changing PR validated locally; shared database preview skipped until merge.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages
        id: wrangler
        if: steps.check-credentials.outputs.configured == 'true' && (github.event_name == 'push' || steps.preview-schema.outputs.safe == 'true')
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=snaptally --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  preview-migrations:
    name: runner / preview-migrations
    needs: deploy
    if: github.event_name == 'push' && needs.deploy.outputs.cloudflare-configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: pages-preview-database
      cancel-in-progress: false
    steps:
      - name: Checkout merged migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply merged preview D1 database migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply budget-db-preview --remote --env preview

  preview-comment:
    name: runner / preview-comment
    needs: deploy
    if: github.event_name == 'pull_request' && (needs.deploy.outputs.deployment-url != '' || needs.deploy.outputs.alias-url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Comment preview URL on pull request
        uses: actions/github-script@v8
        env:
          ALIAS_URL: ${{ needs.deploy.outputs.alias-url }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
        with:
          script: |
            const { default: commentPreview } = await import('${{ github.workspace }}/.github/scripts/comment-preview.js');
            await commentPreview({ github, context });
