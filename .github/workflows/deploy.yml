name: deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: runner / deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    outputs:
      alias-url: ${{ steps.wrangler.outputs.pages-deployment-alias-url }}
      deployment-url: ${{ steps.wrangler.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Cloudflare credentials
        id: check-credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for production deployment"
              exit 1
            else
              echo "::warning::Cloudflare credentials are not configured; skipping preview deployment"
            fi
          fi

      - name: Setup pnpm
        if: steps.check-credentials.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.check-credentials.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check-credentials.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build static assets
        if: steps.check-credentials.outputs.configured == 'true'
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: wrangler
        if: steps.check-credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=snaptally --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  preview-comment:
    name: runner / preview-comment
    needs: deploy
    if: github.event_name == 'pull_request' && (needs.deploy.outputs.deployment-url != '' || needs.deploy.outputs.alias-url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL on pull request
        uses: actions/github-script@v8
        env:
          ALIAS_URL: ${{ needs.deploy.outputs.alias-url }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview-deployment -->';
            const aliasUrl = process.env.ALIAS_URL || '';
            const deploymentUrl = process.env.DEPLOYMENT_URL || '';
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const headRef = context.payload.pull_request.head.ref;

            let body = `${marker}\n### Cloudflare Pages Preview Deployed\n\n`;
            if (aliasUrl) {
              body += `- **Preview URL:** [${aliasUrl}](${aliasUrl})\n`;
            }
            if (deploymentUrl && deploymentUrl !== aliasUrl) {
              body += `- **Deployment URL:** [${deploymentUrl}](${deploymentUrl})\n`;
            }
            body += `- **Commit:** ${commitSha}\n`;
            body += `- **Branch:** ${headRef}\n`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c =>
              c.user?.type === 'Bot' &&
              (c.user?.login === 'github-actions[bot]' || c.user?.login === 'github-actions') &&
              c.body &&
              c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
